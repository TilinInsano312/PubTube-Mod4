name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint, test and build
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/gateway
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --select E4,E7,E9,F app tests

      - name: Test
        run: pytest -q

      - name: Build Python sources
        run: python -m compileall -q app

  docker:
    name: Validate Compose and build Docker image
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Docker Compose with alternate gateway port
        run: GATEWAY_PORT=8010 docker compose config --quiet

      - name: Build gateway image
        run: docker build --tag pubtube-gateway:ci ./gateway

      - name: Smoke test observability (default ports)
        run: ./scripts/ci/smoke-observability.sh

      - name: Show Docker state and logs after default smoke failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Stop stack before alternate port smoke test
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Smoke test observability (alternate gateway port)
        run: GATEWAY_PORT=8010 ./scripts/ci/smoke-observability.sh

      - name: Show Docker state and logs after alternate smoke failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Clean up Docker stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  deploy-develop:
    name: Deploy develop to server
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pubtube-mod4' }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PORT; do
            if [[ -z "${!name}" ]]; then
              printf 'Required deployment setting is missing: %s\n' "$name" >&2
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            printf 'DEPLOY_HOST must be a hostname or IPv4 address.\n' >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            printf 'DEPLOY_USER contains unsupported characters.\n' >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            printf 'DEPLOY_PORT must be between 1 and 65535.\n' >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ || "$DEPLOY_PATH" == *"/../"* || "$DEPLOY_PATH" == */.. ]]; then
            printf 'DEPLOY_PATH must be an absolute path without parent-directory segments.\n' >&2
            exit 1
          fi

          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: Upload commit and restart Compose stack
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pubtube-mod4' }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          remote_command="mkdir -p '$DEPLOY_PATH' && tar -xf - -C '$DEPLOY_PATH' && cd '$DEPLOY_PATH' && docker compose up --detach --build --force-recreate --remove-orphans --wait --wait-timeout 120 && docker compose ps"

          git archive --format=tar "$GITHUB_SHA" | ssh \
            -i "$ssh_dir/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            "$remote" "$remote_command"
