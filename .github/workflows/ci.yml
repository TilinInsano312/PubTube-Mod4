name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint, test and build
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/gateway
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --select E4,E7,E9,F app tests

      - name: Test Gateway including dashboard aggregation and API
        run: pytest -q tests

      - name: Build Python sources
        run: python -m compileall -q app

  docker:
    name: Validate Compose and build Docker image
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Docker Compose with alternate gateway port
        run: GATEWAY_PORT=8010 docker compose config --quiet

      - name: Validate production Compose including M1 migration profile
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
          MINIO_ACCESS_KEY: ci_access_key
          MINIO_SECRET_KEY: ci_secret_key_placeholder
          GARAGE_RPC_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GARAGE_ADMIN_TOKEN: ci_admin_token
          M3_POSTGRES_USER: ci_m3_user
          M3_POSTGRES_PASSWORD: ci_m3_password
          M3_POSTGRES_DB: ci_m3_db
        run: |
          mkdir -p envsModulos
          printf 'DATABASE_URL=postgresql+psycopg2://ci:ci@postgres:5432/ci\nSESSION_SECRET_KEY=ci-only\n' > envsModulos/envmodulo3
          printf 'RABBITMQ_USER=ci_m2_rabbit\nRABBITMQ_PASS=ci_m2_rabbit_password\nPOSTGRES_DB=ci_m2_events\nPOSTGRES_USER=ci_m2_user\nPOSTGRES_PASSWORD=ci_m2_password\n' > envsModulos/envmodulo2
          docker compose -f docker-compose.prod.yml --profile migrate config --quiet

      - name: Build gateway image
        run: docker build --tag pubtube-gateway:ci ./gateway

      - name: Smoke test observability (default ports)
        run: ./scripts/ci/smoke-observability.sh

      - name: Show Docker state and logs after default smoke failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Stop stack before alternate port smoke test
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Smoke test observability (alternate gateway port)
        run: GATEWAY_PORT=8010 ./scripts/ci/smoke-observability.sh

      - name: Show Docker state and logs after alternate smoke failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Clean up Docker stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  publish-develop:
    name: Publish Gateway image to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-develop
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish develop for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tilininsano312/pubtube-mod4:develop
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
