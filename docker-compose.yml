services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_PORT: "${GATEWAY_PORT:-8000}"
      GATEWAY_ENVIRONMENT: "${GATEWAY_ENVIRONMENT:-local}"
      DASHBOARD_URL: "http://dashboard-api:${DASHBOARD_PORT:-8004}"
      MODULE1_URL: "${MODULE1_URL:-http://module1-api:8000}"
      MODULE2_URL: "${MODULE2_URL:-http://module2-api:8002}"
      MODULE3_URL: "${MODULE3_URL:-http://module3-api:8000}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      GATEWAY_PUBLIC_TEST_ROUTES: "${GATEWAY_PUBLIC_TEST_ROUTES:-true}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-60}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-module4-gateway}"
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-otlp}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-always_on}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-}"
    ports:
      - "${GATEWAY_PORT:-8000}:${GATEWAY_PORT:-8000}"
    networks:
      - pubtube-network
    depends_on:
      dashboard-api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.environ['GATEWAY_PORT'];
          urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard-api:
    build:
      context: ./dashboard-api
      dockerfile: Dockerfile
    environment:
      DASHBOARD_PORT: "${DASHBOARD_PORT:-8004}"
      DASHBOARD_ENVIRONMENT: "${GATEWAY_ENVIRONMENT:-local}"
      OTEL_SERVICE_NAME: module4-dashboard
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-otlp}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
    expose:
      - "${DASHBOARD_PORT:-8004}"
    networks:
      - pubtube-network
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.environ['DASHBOARD_PORT'];
          urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.5.0
    entrypoint:
      - /bin/sh
      - -c
      - 'sed -e "s/__GATEWAY_PORT__/$${GATEWAY_PORT}/g" -e "s/__DASHBOARD_PORT__/$${DASHBOARD_PORT}/g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml'
    environment:
      GATEWAY_PORT: "${GATEWAY_PORT:-8000}"
      DASHBOARD_PORT: "${DASHBOARD_PORT:-8004}"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
    networks:
      - pubtube-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - pubtube-network

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    networks:
      - pubtube-network

networks:
  pubtube-network:
    name: pubtube-network
