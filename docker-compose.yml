services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_PORT: "${GATEWAY_PORT:-8000}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-60}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
    ports:
      - "${GATEWAY_PORT:-8000}:${GATEWAY_PORT:-8000}"
    networks:
      - pubtube-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.environ['GATEWAY_PORT'];
          urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.5.0
    entrypoint:
      - /bin/sh
      - -c
      - 'sed "s/__GATEWAY_PORT__/$${GATEWAY_PORT}/g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml'
    environment:
      GATEWAY_PORT: "${GATEWAY_PORT:-8000}"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
    networks:
      - pubtube-network

networks:
  pubtube-network:
    name: pubtube-network
